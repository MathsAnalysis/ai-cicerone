services:
  app:
    build: ./aicicerone
    container_name: aicicerone
    restart: unless-stopped
    env_file: ./aicicerone/.env
    environment:
      LLM_URL: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
    depends_on: [ollama, searxng]
    volumes:
      - /var/www/aicicerone/video:/app/dist/client/video:ro
    ports:
      - "127.0.0.1:4321:4321"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama:
    image: ollama/ollama:latest
    container_name: aicicerone-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_LOAD_TIMEOUT: 10m
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ollama:/root/.ollama
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  ollama-pull:
    image: ollama/ollama:latest
    env_file: ./aicicerone/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull \"$${CHAT_MODEL:-qwen3:1.7b}\""]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    container_name: aicicerone-searxng
    restart: unless-stopped
    volumes:
      - ./aicicerone/deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-cambiami-con-una-stringa-casuale}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ollama: {}
