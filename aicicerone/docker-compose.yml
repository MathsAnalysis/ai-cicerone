# Stack completo su un solo server: sito + IA locale (Ollama) + ricerca web (SearXNG) + HTTPS (Caddy).
# Uso: copiare .env.example in .env, impostare DOMAIN e SMTP_URL, poi `docker compose up -d --build`.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LLM_URL: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
    depends_on: [ollama, searxng]
    expose: ["4321"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # GPU NVIDIA: scommentare (richiede nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Scarica il modello al primo avvio (CHAT_MODEL da .env, default qwen3:8b).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${CHAT_MODEL:-qwen3:8b}"]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes: ["./deploy/searxng:/etc/searxng:rw"]
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-cambiami-con-una-stringa-casuale}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    depends_on: [app]

volumes:
  ollama: {}
  caddy_data: {}
  caddy_config: {}
