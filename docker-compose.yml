# Stack sulla VPS dietro nginx sull'host: sito Node (porta locale 4321), IA locale (Ollama su CPU)
# e ricerca web self-hosted (SearXNG). Modello e SMTP si impostano in aicicerone/.env.
services:
  app:
    build: ./aicicerone
    container_name: aicicerone
    restart: unless-stopped
    env_file: ./aicicerone/.env
    environment:
      LLM_URL: http://ollama:11434
      SEARXNG_URL: http://searxng:8080
    depends_on: [ollama, searxng]
    volumes:
      - /var/www/aicicerone/video:/app/dist/client/video:ro
    ports:
      - "127.0.0.1:4321:4321"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # IA locale su CPU. Modello leggero di default qwen3:1.7b (~2 GB RAM, risposte in pochi secondi);
  # con 4 GB liberi qwen3:4b, con 8 GB qwen3:8b (CHAT_MODEL in aicicerone/.env). GPU NVIDIA: blocco deploy.
  ollama:
    image: ollama/ollama:latest
    container_name: aicicerone-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 2
    volumes:
      - ollama:/root/.ollama
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Scarica (o aggiorna) il modello indicato da CHAT_MODEL in aicicerone/.env; esce quando ha finito.
  ollama-pull:
    image: ollama/ollama:latest
    env_file: ./aicicerone/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull \"$${CHAT_MODEL:-qwen3:1.7b}\""]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    container_name: aicicerone-searxng
    restart: unless-stopped
    volumes:
      - ./aicicerone/deploy/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-cambiami-con-una-stringa-casuale}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ollama: {}
