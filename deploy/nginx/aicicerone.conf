server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    # Compressione
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/woff2 application/x-ndjson;


    # Proxy comune
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Cache comune
    proxy_cache aicicerone;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;

    # Asset con hash nel nome: immutabili
    location ^~ /_astro/ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Video: serviti direttamente da disco (sendfile, Range nativo)
    location ^~ /video/ {
        include snippets/aicicerone-headers.conf;
        alias /var/www/aicicerone/video/;
        add_header Cache-Control "public, max-age=604800" always;
        sendfile on;
        tcp_nopush on;
        aio threads;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 8m;
        access_log off;
    }

    # API: streaming NDJSON della chat, mai in cache
    location ^~ /api/ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # File statici di root (favicon, manifest, og, sitemap, robots, font)
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|webmanifest|xml|txt|woff2?)$ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Pagine prerenderizzate
    location / {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 301 302 5m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 404 1m;
    }
}
