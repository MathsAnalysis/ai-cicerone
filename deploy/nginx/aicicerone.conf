# Keep HTTP available for certificate validation; all app traffic uses HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 208.113.211.142;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://208.113.211.142$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 208.113.211.142;

    ssl_certificate /etc/letsencrypt/live/208.113.211.142/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/208.113.211.142/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AiCiceroneTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/woff2 application/x-ndjson;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_cache aicicerone;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_revalidate on;

    location ^~ /_astro/ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /video/ {
        include snippets/aicicerone-headers.conf;
        alias /var/www/aicicerone/video/;
        add_header Cache-Control "public, max-age=604800" always;
        sendfile on;
        tcp_nopush on;
        aio threads;
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 8m;
        access_log off;
    }

    location ^~ /api/ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|webmanifest|xml|txt|woff2?)$ {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        include snippets/aicicerone-headers.conf;
        proxy_pass http://aicicerone;
        proxy_cache_valid 200 301 302 5m;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache_valid 404 1m;
    }
}
